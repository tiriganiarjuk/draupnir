[project]
name = "draupnir"
version = "0.1.0"
description = "Schema generator — walks composition trees from root schema definitions to produce JSON Schema"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "typer>=0.9",
]

[project.scripts]
draupnir = "draupnir.cli:main"
draupnir-generate-models = "draupnir.cli:generate_models_main"
draupnir-export-schemas = "draupnir.cli:export_schemas_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.23",
    # Exact pin: structure/gen/ is reproducible only on this version.
    # TODO: move to 0.91.0 — it changes the generated models
    # (`exists: Literal[True] = True` becomes `Literal[True] | None = None`),
    # so review that diff first.
    "datamodel-code-generator==0.55.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
